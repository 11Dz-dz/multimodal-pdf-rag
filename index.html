<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多模态检索</title>
  <style>
    :root { color-scheme: light; --ink:#222c36; --muted:#596774; --border:#dce3e7; --green:#16645f; }
    [hidden] { display:none !important; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f3f6f6; color:var(--ink); font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:1050px; margin:auto; padding:32px 22px 55px; }
    h1 { margin:0; font-size:clamp(25px,4vw,35px); line-height:1.25; }
    h2 { margin:0 0 12px; font-size:18px; }
    p { margin:.5em 0; }
    .muted { color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; margin-top:22px; }
    section { padding:20px; background:white; border:1px solid var(--border); border-radius:12px; }
    .upload { margin-top:20px; }
    .upload form { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    input[type=file] { font:inherit; max-width:100%; }
    #benchmark-document { width:100%; font:inherit; padding:8px 10px; border:1px solid #aebdc4; border-radius:7px; }
    #document-name { overflow-wrap:anywhere; }
    .buttons { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button { border:1px solid var(--border); background:white; color:var(--ink); padding:8px 12px; border-radius:7px; cursor:pointer; font:inherit; }
    button:disabled { opacity:.65; cursor:wait; }
    button.primary { background:var(--green); color:white; border-color:var(--green); }
    textarea { display:block; min-height:86px; width:100%; resize:vertical; font:inherit; padding:10px 12px; border:1px solid #aebdc4; border-radius:7px; }
    .actions { margin-top:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .answer { margin-top:18px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .progress { padding:10px 13px; border:1px solid var(--border); border-radius:8px; background:#f6faf9; }
    .progress summary { color:var(--ink); font-weight:600; }
    .progress-time { float:right; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
    .progress ol { margin:9px 0 0; padding:0; list-style:none; }
    .progress li { display:flex; gap:9px; align-items:baseline; color:var(--muted); font-size:14px; }
    .progress li::before { content:""; flex:0 0 6px; height:6px; border-radius:50%; background:#a4bbb8; }
    .progress[data-running] li:last-child { color:var(--ink); }
    .progress[data-running] li:last-child::before { background:var(--green); }
    #preview { width:100%; max-height:430px; object-fit:contain; border:1px solid var(--border); background:#f8f9fa; border-radius:8px; }
    a { color:var(--green); }
    details { margin-top:16px; }
    summary { cursor:pointer; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; max-height:430px; overflow:auto; background:#f3f6f6; padding:13px; border-radius:7px; font-size:12px; }
    @media (max-width:700px) { .layout{grid-template-columns:1fr} main{padding:22px 14px 36px} section{padding:16px} }
  </style>
</head>
<body>
<main>
  <h1>多模态检索</h1>
  <section id="benchmark" class="upload" hidden>
    <h2>MMLongBench-Doc 测试集</h2>
    <label for="benchmark-document">选择 PDF</label>
    <select id="benchmark-document"><option value="">请选择文档</option></select>
    <p><a href="/api/benchmark/test-set">下载题目、标准答案和证据页</a></p>
  </section>
  <section class="upload">
    <h2>上传 PDF</h2>
    <form id="upload-form">
      <input id="pdf-file" name="file" type="file" accept=".pdf,application/pdf" required aria-label="选择 PDF">
      <button id="upload-button" class="primary">上传并建索引</button>
    </form>
    <p class="muted">单个 PDF 最大 20 MB，最多 40 页。</p>
    <p id="upload-status" role="status" hidden></p>
    <p id="document-name" hidden></p>
  </section>
  <div id="workspace" class="layout" hidden>
    <section>
      <h2>文档问答</h2>
      <form id="form">
        <label for="question">问题</label>
        <textarea id="question" maxlength="400" placeholder="输入你想在这份 PDF 中查找的问题" required></textarea>
        <div class="actions">
          <button id="submit" class="primary">检索并回答</button>
          <label><input id="visual" type="checkbox" checked> 使用页图辅助回答</label>
        </div>
      </form>
      <details id="progress" class="progress" hidden>
        <summary>处理进度 <span id="progress-time" class="progress-time"></span></summary>
        <ol id="progress-log" aria-live="polite" aria-relevant="additions"></ol>
      </details>
      <p id="status" class="muted" role="status"></p>
      <div id="answer" class="answer" aria-live="polite"></div>
      <details id="trace-pane" hidden><summary>查看检索与证据核验</summary><pre id="trace"></pre></details>
    </section>
    <section>
      <h2>文档预览</h2>
      <p class="muted">检索后可切换到候选证据页。</p>
      <div id="pages" class="buttons"></div>
      <a id="preview-link" target="_blank" rel="noopener"><img id="preview" alt="当前 PDF 页"></a>
      <p><a id="document" target="_blank" rel="noopener">打开原始 PDF</a></p>
    </section>
  </div>
</main>
<script>
  const get = id => document.getElementById(id);
  let activeDocument;
  const benchmarkDocuments = new Map();
  const sessionKey = 'multimodal-active-pdf';

  async function responseJson(response) {
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = typeof data.detail === 'string' ? data.detail : '请求失败（' + response.status + '）';
      const error = new Error(message);
      error.status = response.status;
      throw error;
    }
    return data;
  }

  async function api(url, options) {
    return responseJson(await fetch(url, options));
  }

  function showProgress(event) {
    const messages = {
      waiting: '等待前一个请求完成',
      preparing_document: '正在加载文档索引',
      retrieving: '正在检索文本和页图',
      opened: '已打开第 ' + (event.pages || []).join('、') + ' 页',
      reading: '正在核对已打开的证据（第 ' + event.round + ' 轮）',
      searching: '正在搜索补充证据',
      zooming: '正在放大页面局部',
      finalizing: '正在整理答案和页码引用',
      answering: '正在检索证据并生成答案'
    };
    const message = messages[event.stage];
    const log = get('progress-log');
    if (!message || log.lastElementChild?.textContent === message) return;
    const item = document.createElement('li');
    item.textContent = message;
    log.append(item);
  }

  async function questionStream(payload) {
    const response = await fetch(documentUrl() + '/ask/stream', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if (!response.ok) await responseJson(response);
    if (!response.body) throw new Error('无法接收作答进度。');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    try {
      while (true) {
        const {done, value} = await reader.read();
        buffer += decoder.decode(value, {stream:!done});
        const lines = buffer.split('\n');
        buffer = done ? '' : lines.pop();
        for (const line of lines) {
          if (!line) continue;
          const event = JSON.parse(line);
          if (event.type === 'progress') showProgress(event);
          if (event.type === 'answer') return event.data;
          if (event.type === 'error') throw new Error(event.message);
        }
        if (done) throw new Error('作答连接已断开，请重试。');
      }
    } finally {
      await reader.cancel().catch(() => {});
      reader.releaseLock();
    }
  }

  function documentUrl() {
    return '/api/documents/' + encodeURIComponent(activeDocument.id);
  }

  function showPage(page) {
    const url = documentUrl() + '/pages/' + page;
    get('preview').src = url;
    get('preview').alt = '第 ' + page + ' 页';
    get('preview-link').href = url;
    get('document').href = documentUrl() + '/pdf#page=' + page;
  }

  function openDocument(data) {
    activeDocument = data;
    sessionStorage.setItem(sessionKey, data.id);
    get('document-name').textContent = data.filename + ' · ' + data.pages + ' 页';
    get('document-name').hidden = false;
    if (benchmarkDocuments.has(data.id)) get('benchmark-document').value = data.id;
    get('workspace').hidden = false;
    get('question').value = '';
    get('answer').textContent = '';
    get('status').textContent = '';
    get('progress').hidden = true;
    get('pages').replaceChildren();
    get('trace-pane').hidden = true;
    get('trace-pane').open = false;
    showPage(1);
  }

  function busy(value) {
    get('submit').disabled = value;
    get('upload-button').disabled = value;
    get('pdf-file').disabled = value;
    get('benchmark-document').disabled = value;
  }

  get('upload-form').addEventListener('submit', async event => {
    event.preventDefault();
    const file = get('pdf-file').files[0];
    if (!file) return;
    const status = get('upload-status');
    status.hidden = false;
    if (!file.name.toLowerCase().endsWith('.pdf') || file.size > 20 * 1024 * 1024) {
      status.textContent = '请选择 20 MB 以内的 PDF。';
      return;
    }
    const form = new FormData();
    form.append('file', file);
    busy(true);
    status.textContent = '正在上传、解析并建立索引，请保持页面打开。';
    try {
      const data = await api('/api/documents', {method:'POST', body:form});
      openDocument(data);
      status.textContent = '已建立索引，可以提问。';
      get('question').focus();
    } catch (error) {
      status.textContent = error.message;
    } finally {
      busy(false);
    }
  });

  get('form').addEventListener('submit', async event => {
    event.preventDefault();
    const question = get('question').value.trim();
    if (!activeDocument || !question) return;
    busy(true);
    const benchmarkDocument = benchmarkDocuments.get(activeDocument.id);
    const progress = get('progress');
    progress.hidden = false;
    progress.open = true;
    progress.setAttribute('data-running', '');
    get('progress-log').replaceChildren();
    get('status').textContent = '';
    get('answer').textContent = '';
    get('trace-pane').hidden = true;
    get('pages').replaceChildren();
    const started = performance.now();
    const updateTime = () => {
      get('progress-time').textContent = ((performance.now() - started) / 1000).toFixed(1) + ' 秒';
    };
    updateTime();
    const timer = setInterval(updateTime, 250);
    try {
      const data = await questionStream({question, visual:get('visual').checked});
      if (benchmarkDocument) benchmarkDocument.indexed = true;
      get('answer').textContent = data.answer;
      for (const citation of data.citations || []) {
        const link = document.createElement('a');
        link.href = documentUrl() + '/pdf#page=' + citation.page;
        link.target = '_blank';
        link.rel = 'noopener';
        const reference = citation.reference ? ' · ' + citation.reference : '';
        link.textContent = '〔第 ' + citation.page + ' 页' + reference + '〕';
        get('answer').append(' ', link);
      }
      get('trace').textContent = JSON.stringify(data.trace ? {...data.trace, chunks:data.retrieval} : data.retrieval, null, 2);
      get('trace-pane').hidden = false;
      const pages = [...new Set(data.retrieval.map(chunk => chunk.page).filter(Number.isInteger))];
      if (pages.length) showPage(pages[0]);
      for (const page of pages) {
        const button = document.createElement('button');
        button.textContent = '第 ' + page + ' 页';
        button.addEventListener('click', () => showPage(page));
        get('pages').append(button);
      }
      get('status').textContent = data.cache_hit ? '已命中缓存' : '本次使用图像 ' + data.images_seen_by_model + ' 张';
      progress.open = false;
    } catch (error) {
      get('status').textContent = error.message;
    } finally {
      clearInterval(timer);
      updateTime();
      progress.removeAttribute('data-running');
      busy(false);
    }
  });
  get('benchmark-document').addEventListener('change', event => {
    const data = benchmarkDocuments.get(event.target.value);
    if (data) openDocument(data);
  });

  async function restoreDocument() {
    const lastDocument = sessionStorage.getItem(sessionKey);
    busy(true);
    try {
      const status = await api('/api/status');
      if (status.benchmark) {
        const documents = await api('/api/benchmark/documents');
        for (const doc of documents) {
          benchmarkDocuments.set(doc.id, doc);
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = doc.filename + ' · ' + doc.pages + ' 页 · ' + doc.questions + ' 道题';
          get('benchmark-document').append(option);
        }
        get('benchmark').hidden = false;
      }
      if (lastDocument) openDocument(await api('/api/documents/' + encodeURIComponent(lastDocument)));
    } catch (error) {
      if (error.status === 404) sessionStorage.removeItem(sessionKey);
    } finally {
      busy(false);
    }
  }
  restoreDocument();
</script>
</body>
</html>
